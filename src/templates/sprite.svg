<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
  <!-- Wózek widłowy -->
  <symbol id="i-forklift" viewBox="0 0 120 100">
    <rect x="8" y="56" width="54" height="24" rx="4" fill="currentColor"/>
    <polyline points="22,56 22,24 48,24 58,56" fill="none" stroke="currentColor" stroke-width="5" stroke-linejoin="round"/>
    <rect x="26" y="44" width="14" height="12" rx="2" fill="currentColor"/>
    <line x1="44" y1="48" x2="51" y2="38" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/>
    <rect x="66" y="12" width="6" height="70" fill="currentColor"/>
    <rect x="73" y="48" width="4" height="34" fill="#F4741B"/>
    <rect x="73" y="77" width="34" height="5" fill="#F4741B"/>
    <circle cx="23" cy="83" r="11" fill="currentColor"/><circle cx="23" cy="83" r="4.5" style="fill:var(--hub,#fff)"/>
    <circle cx="53" cy="83" r="12" fill="currentColor"/><circle cx="53" cy="83" r="5" style="fill:var(--hub,#fff)"/>
  </symbol>
  <!-- Podest nożycowy -->
  <symbol id="i-scissor" viewBox="0 0 120 100">
    <rect x="24" y="4" width="72" height="18" rx="2" fill="none" stroke="currentColor" stroke-width="3.5"/>
    <line x1="48" y1="4" x2="48" y2="22" stroke="currentColor" stroke-width="3"/>
    <line x1="72" y1="4" x2="72" y2="22" stroke="currentColor" stroke-width="3"/>
    <rect x="18" y="22" width="84" height="8" rx="2" fill="#F4741B"/>
    <path d="M30 30 L90 50 M90 30 L30 50 M30 50 L90 70 M90 50 L30 70" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
    <rect x="14" y="70" width="92" height="11" rx="3" fill="#F4741B"/>
    <circle cx="30" cy="85" r="7" fill="currentColor"/><circle cx="30" cy="85" r="2.6" style="fill:var(--hub,#fff)"/>
    <circle cx="90" cy="85" r="7" fill="currentColor"/><circle cx="90" cy="85" r="2.6" style="fill:var(--hub,#fff)"/>
  </symbol>
  <!-- Ładowarka teleskopowa -->
  <symbol id="i-telehandler" viewBox="0 0 140 100">
    <path d="M38 64 L118 26 L122 34 L44 72 Z" fill="#F4741B"/>
    <path d="M100 34 L118 26 L122 34 L104 42 Z" fill="currentColor"/>
    <rect x="8" y="58" width="94" height="20" rx="4" fill="currentColor"/>
    <rect x="18" y="32" width="28" height="27" rx="3" style="fill:var(--hub,#fff)" stroke="currentColor" stroke-width="4.5"/>
    <line x1="25" y1="40" x2="25" y2="56" stroke="currentColor" stroke-width="3"/>
    <path d="M123 30 V52 H138" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linejoin="round"/>
    <circle cx="28" cy="80" r="13" fill="currentColor"/><circle cx="28" cy="80" r="5.5" style="fill:var(--hub,#fff)"/>
    <circle cx="82" cy="80" r="13" fill="currentColor"/><circle cx="82" cy="80" r="5.5" style="fill:var(--hub,#fff)"/>
  </symbol>
  <!-- Podest przegubowy (zwyżka koszowa) -->
  <symbol id="i-boom" viewBox="0 0 120 100">
    <rect x="94" y="8" width="22" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="3.5"/>
    <rect x="92" y="21" width="26" height="6" rx="1.5" fill="#F4741B"/>
    <path d="M44 58 L66 26" stroke="#F4741B" stroke-width="8" stroke-linecap="round"/>
    <path d="M66 26 L100 26" stroke="#F4741B" stroke-width="7" stroke-linecap="round"/>
    <circle cx="66" cy="26" r="5" fill="currentColor"/>
    <rect x="34" y="52" width="22" height="12" rx="2" fill="currentColor"/>
    <rect x="12" y="62" width="70" height="16" rx="4" fill="currentColor"/>
    <circle cx="26" cy="82" r="9" fill="currentColor"/><circle cx="26" cy="82" r="3.5" style="fill:var(--hub,#fff)"/>
    <circle cx="68" cy="82" r="9" fill="currentColor"/><circle cx="68" cy="82" r="3.5" style="fill:var(--hub,#fff)"/>
  </symbol>
  <!-- Kask (BHP) -->
  <symbol id="i-helmet" viewBox="0 0 120 100">
    <path d="M22 66 C22 38 40 22 60 22 C80 22 98 38 98 66 Z" fill="#F4741B"/>
    <path d="M54 22.5 h12 v43 h-12 z" fill="currentColor" opacity=".9"/>
    <rect x="10" y="64" width="100" height="10" rx="5" fill="currentColor"/>
    <path d="M36 64 C36 48 42 38 50 33" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".6"/>
  </symbol>
  <!-- Znacznik listy -->
  <symbol id="i-check" viewBox="0 0 24 24">
    <path d="M4 12.5 L9.5 18 L20 6.5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>
</svg>
